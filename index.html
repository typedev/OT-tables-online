function escHtml(s) {
  if (!s && s !== 0) return '<span style="color:var(--text-dim)">\u2014</span>';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const _truncId = { n: 0 };
function formatCell(v) {
  if (!v && v !== 0) return '<span style="color:var(--text-dim)">\u2014</span>';
  const s = String(v);
  if (s.length <= 150) return escHtml(s);
  const id = 'trunc_' + (_truncId.n++);
  const short = escHtml(s.slice(0,150)) + '\u2026';
  const full = escHtml(s);
  return `<span id="${id}_s">${short} <a class="show-full-btn" onclick="event.stopPropagation();document.getElementById('${id}_s').style.display='none';document.getElementById('${id}_f').style.display='inline'">show\u00a0full</a></span><span id="${id}_f" style="display:none">${full} <a class="show-full-btn" onclick="event.stopPropagation();document.getElementById('${id}_f').style.display='none';document.getElementById('${id}_s').style.display='inline'">collapse</a></span>`;
}

function toggleSection(el) {
  el.classList.toggle('collapsed');
  const body = el.nextElementSibling;
  if (body) body.style.display = el.classList.contains('collapsed') ? 'none' : '';
}

// ── Add Name ID ──

function showAddNameIdMenu(event) {
  event.stopPropagation();
  // Remove existing dropdown
  const old = document.querySelector('.name-id-dropdown');
  if (old) { old.remove(); return; }

  // Compute visible IDs
  const visible = new Set();
  for (const f of fonts)
    if (f.nameTable) Object.keys(f.nameTable).forEach(k => visible.add(String(k)));
  addedNameIds.forEach(id => visible.add(String(id)));
  for (const key of pendingChanges.keys()) {
    const parts = key.split('|');
    if (parts[1] === 'name') visible.add(parts[2]);
  }

  // Available IDs
  const available = Object.keys(NAME_IDS).filter(id => !visible.has(String(id)))
    .sort((a, b) => parseInt(a) - parseInt(b));
  if (available.length === 0) return;

  const dd = document.createElement('div');
  dd.className = 'name-id-dropdown';
  for (const id of available) {
    const item = document.createElement('div');
    item.className = 'item';
    item.textContent = `${id} \u2014 ${NAME_IDS[id]}`;
    item.onclick = (e) => { e.stopPropagation(); addNameId(parseInt(id)); dd.remove(); };
    dd.appendChild(item);
  }

  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();
  dd.style.position = 'fixed';
  dd.style.top = (rect.bottom + 4) + 'px';
  dd.style.left = rect.left + 'px';
  document.body.appendChild(dd);

  const close = (e) => { if (!dd.contains(e.target)) { dd.remove(); document.removeEventListener('mousedown', close); } };
  setTimeout(() => document.addEventListener('mousedown', close), 0);
}

function addNameId(id) {
  addedNameIds.add(id);
  renderTables();
}

// ── Table Directory ──

function renderTableDirectory() {
  if (fonts.length === 0) return '';
  const allTags = new Set();
  for (const f of fonts)
    if (f.binaryRecords) for (const r of f.binaryRecords) allTags.add(r.tag);
  const tags = [...allTags].sort();
  if (tags.length === 0) return '';

  let html = `<div class="section-header" onclick="toggleSection(this)">
    <span class="arrow">\u25bc</span> Table Directory
  </div><div class="section-body">
  <div style="font-size:11px; color:var(--text-dim); margin-bottom:8px; padding:0 2px;">
    Check <b style="color:var(--red)">Del</b> to mark tables for removal from the font binary. Checked tables will be deleted when you download modified fonts.
  </div>
  <table class="compare"><thead><tr>
    <th class="del-col">Del</th><th style="width:80px">Tag</th>`;
  fonts.forEach(f => {
    html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span></th>`;
  });
  html += `</tr></thead><tbody>`;

  for (const tag of tags) {
    const isDel = deletedTables.has(tag);
    const rowCls = isDel ? ' class="row-deleted"' : '';
    html += `<tr${rowCls}>
      <td class="del-col"><input type="checkbox" ${isDel?'checked':''} onchange="toggleTableDelete('${tag}')"></td>
      <td class="param-name">${tag}</td>`;
    for (const f of fonts) {
      const rec = f.binaryRecords ? f.binaryRecords.find(r => r.tag === tag) : null;
      html += `<td class="size-cell">${rec ? formatSize(rec.length) : '\u2014'}</td>`;
    }
    html += `</tr>`;
  }
  html += '</tbody></table></div>';
  return html;
}

// ── Comparison tables ──

function buildCompareTable(title, tableName, getRowData, formatVal, extraFields) {
  if (fonts.length === 0) return '';
  const showEmpty = document.getElementById('showEmpty').checked;
  const diffOnly = document.getElementById('diffOnly').checked;

  const allFields = new Set();
  const datas = fonts.map(f => getRowData(f) || {});
  datas.forEach(d => Object.keys(d).forEach(k => allFields.add(k)));
  if (extraFields) extraFields.forEach(k => allFields.add(String(k)));
  const fields = [...allFields].sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });

  let html = `<div class="section-header" onclick="toggleSection(this)">
    <span class="arrow">\u25bc</span> ${title}`;
  if (tableName === 'name') {
    html += ` <span class="btn-add-name" onclick="event.stopPropagation(); showAddNameIdMenu(event)" title="Add name record">+ Add ID</span>`;
  }
  html += `</div><div class="section-body">
  <table class="compare"><thead><tr>
    <th class="param-col">Parameter</th>`;
  fonts.forEach((f, i) => {
    html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span>
      <span class="remove-font" onclick="removeFont(${i})" title="Remove">\u2715</span></th>`;
  });
  html += `</tr></thead><tbody>`;

  for (const field of fields) {
    const vals = datas.map(d => {
      const raw = d[field];
      return formatVal ? formatVal(field, raw) : (raw != null ? String(raw) : '');
    });
    const allEmpty = vals.every(v => v === '' || v === undefined || v === null);
    const allSame = vals.every(v => v === vals[0]);
    const hasDiff = !allSame && !allEmpty;
    if (diffOnly && !hasDiff) continue;
    const emptyClass = allEmpty ? (showEmpty ? 'all-empty show-empty' : 'all-empty') : '';
    const diffClass = hasDiff ? 'has-diff' : '';

    let label = field;
    if (tableName === 'name' && NAME_IDS[field]) label = `${field} \u2014 ${NAME_IDS[field]}`;

    const readonly = isReadonlyField(tableName, field);
    const editKind = FIELD_SPECS[tableName + '|' + field] ? ' has-picker' : '';
    html += `<tr class="${emptyClass} ${diffClass}"><td class="param-name">${label}</td>`;
    vals.forEach((v, i) => {
      const key = fonts[i].fileName + '|' + tableName + '|' + field;
      const change = pendingChanges.get(key);
      const isEdited = !!change;
      const isDelete = change && change.action === 'delete';
      const editedClass = isEdited ? (isDelete ? ' edited marked-delete' : ' edited') : '';
      let cellContent = isDelete
        ? '<span style="color:var(--red);font-style:italic;">\u232b DELETE</span>'
        : formatCell(isEdited ? change.new_value : v);
      if (editKind && !isDelete) {
        const warns = getFieldWarnings(i, tableName, field, parseIntInput(isEdited ? change.new_value : v));
        if (warns.length)
          cellContent += ` <span class="cell-warn" title="${escHtml(warns.map(w => w.msg).join('\n'))}">\u26a0</span>`;
      }
      html += readonly
        ? `<td class="val readonly" title="Read-only field">${cellContent}</td>`
        : `<td class="val${editedClass}${editKind}" ondblclick="startEdit(this,${i},'${tableName}','${field}')">${cellContent}</td>`;
    });
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

// ── STAT table (read-only) ──

function formatSTATAxisValue(av, axes, font) {
  const name = resolveNameID(font, av.nameID);
  const nameStr = name ? `"${name}"` : `nameID ${av.nameID}`;
  const elidable = (av.flags & 0x0002) ? ' [ELIDABLE]' : '';
  const getTag = (idx) => (axes && axes[idx]) ? axes[idx].tag : `axis${idx}`;
  switch (av.format) {
    case 1: return `${getTag(av.axisIndex)} ${av.value} ${nameStr}${elidable}`;
    case 2: return `${getTag(av.axisIndex)} ${av.nominalValue} [${av.rangeMinValue}..${av.rangeMaxValue}] ${nameStr}${elidable}`;
    case 3: return `${getTag(av.axisIndex)} ${av.value} \u2192 ${av.linkedValue} ${nameStr}${elidable}`;
    case 4: {
      const parts = av.values.map(v => `${getTag(v.axisIndex)}=${v.value}`);
      return `${parts.join(', ')} ${nameStr}${elidable}`;
    }
    default: return `fmt${av.format} ${nameStr}`;
  }
}

function renderSTAT() {
  if (fonts.length === 0) return '';
  const hasSTAT = fonts.some(f => f.binaryData && f.binaryData.has('STAT'));
  if (!hasSTAT) return '';

  const statData = fonts.map(f => {
    if (!f.binaryData || !f.binaryData.has('STAT')) return null;
    return parseSTAT(f.binaryData.get('STAT'));
  });

  let html = `<div class="section-header" onclick="toggleSection(this)">
    <span class="arrow">\u25bc</span> STAT table
  </div><div class="section-body">`;

  // Design Axes
  const maxAxes = Math.max(0, ...statData.map(s => s ? s.axes.length : 0));
  if (maxAxes > 0) {
    html += `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-label);margin:12px 0 4px;font-weight:600;">Design Axes</div>`;
    html += `<table class="compare"><thead><tr><th class="param-col">Axis</th>`;
    fonts.forEach(f => { html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span></th>`; });
    html += `</tr></thead><tbody>`;
    for (let i = 0; i < maxAxes; i++) {
      const vals = statData.map((s, fi) => {
        if (!s || i >= s.axes.length) return '\u2014';
        const ax = s.axes[i];
        const name = resolveNameID(fonts[fi], ax.nameID);
        return `${ax.tag} \u2014 "${name || 'nameID ' + ax.nameID}" (order: ${ax.axisOrdering})`;
      });
      const allSame = vals.every(v => v === vals[0]);
      html += `<tr class="${!allSame ? 'has-diff' : ''}${i % 2 === 0 ? '' : ''}">`;
      html += `<td class="param-name">Axis ${i}</td>`;
      vals.forEach(v => { html += `<td class="val">${escHtml(v)}</td>`; });
      html += `</tr>`;
    }
    html += `</tbody></table>`;
  }

  // Axis Values
  const maxAV = Math.max(0, ...statData.map(s => s ? s.axisValues.length : 0));
  if (maxAV > 0) {
    html += `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-label);margin:12px 0 4px;font-weight:600;">Axis Values</div>`;
    html += `<table class="compare"><thead><tr><th class="param-col">#</th>`;
    fonts.forEach(f => { html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span></th>`; });
    html += `</tr></thead><tbody>`;
    for (let i = 0; i < maxAV; i++) {
      const vals = statData.map((s, fi) => {
        if (!s || i >= s.axisValues.length) return '\u2014';
        return formatSTATAxisValue(s.axisValues[i], s.axes, fonts[fi]);
      });
      const allSame = vals.every(v => v === vals[0]);
      html += `<tr class="${!allSame ? 'has-diff' : ''}">`;
      html += `<td class="param-name">${i}</td>`;
      vals.forEach(v => { html += `<td class="val">${escHtml(v)}</td>`; });
      html += `</tr>`;
    }
    html += `</tbody></table>`;
  }

  // Elided Fallback Name ID
  const hasElided = statData.some(s => s && s.elidedFallbackNameID != null);
  if (hasElided) {
    html += `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-label);margin:12px 0 4px;font-weight:600;">Elided Fallback</div>`;
    html += `<table class="compare"><thead><tr><th class="param-col">Parameter</th>`;
    fonts.forEach(f => { html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span></th>`; });
    html += `</tr></thead><tbody><tr>`;
    html += `<td class="param-name">elidedFallbackNameID</td>`;
    const vals = statData.map((s, fi) => {
      if (!s || s.elidedFallbackNameID == null) return '\u2014';
      const name = resolveNameID(fonts[fi], s.elidedFallbackNameID);
      return `${s.elidedFallbackNameID} \u2014 "${name || '?'}"`;
    });
    const allSame = vals.every(v => v === vals[0]);
    vals.forEach(v => { html += `<td class="val">${escHtml(v)}</td>`; });
    html += `</tr></tbody></table>`;
  }

  html += `</div>`;
  return html;
}

// ── avar table (read-only) ──

function renderAvar() {
  if (fonts.length === 0) return '';
  const hasAvar = fonts.some(f => f.binaryData && f.binaryData.has('avar'));
  if (!hasAvar) return '';

  const avarData = fonts.map(f => {
    if (!f.binaryData || !f.binaryData.has('avar')) return null;
    return parseAvar(f.binaryData.get('avar'));
  });
  const fvarTags = fonts.map(f => {
    if (!f.binaryData || !f.binaryData.has('fvar')) return [];
    return parseFvarAxisTags(f.binaryData.get('fvar'));
  });

  let html = `<div class="section-header" onclick="toggleSection(this)">
    <span class="arrow">\u25bc</span> avar table
  </div><div class="section-body">`;

  const maxAxes = Math.max(0, ...avarData.map(a => a ? a.axisCount : 0));

  for (let ai = 0; ai < maxAxes; ai++) {
    const axisLabels = fvarTags.map(tags => tags[ai] || `axis${ai}`);
    const label = [...new Set(axisLabels)].join(' / ');

    html += `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-label);margin:12px 0 4px;font-weight:600;">Axis: ${label}</div>`;
    html += `<table class="compare"><thead><tr><th class="param-col">#</th>`;
    fonts.forEach(f => { html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span></th>`; });
    html += `</tr></thead><tbody>`;

    const maxPairs = Math.max(0, ...avarData.map(a => {
      if (!a || ai >= a.axes.length) return 0;
      return a.axes[ai].pairs.length;
    }));

    for (let pi = 0; pi < maxPairs; pi++) {
      const vals = avarData.map(a => {
        if (!a || ai >= a.axes.length || pi >= a.axes[ai].pairs.length) return '';
        const p = a.axes[ai].pairs[pi];
        return `${p.from.toFixed(4)} \u2192 ${p.to.toFixed(4)}`;
      });
      const allSame = vals.every(v => v === vals[0]);
      html += `<tr class="${!allSame ? 'has-diff' : ''}">`;
      html += `<td class="param-name">${pi}</td>`;
      vals.forEach(v => { html += `<td class="val">${v ? escHtml(v) : '\u2014'}</td>`; });
      html += `</tr>`;
    }
    html += `</tbody></table>`;
  }

  html += `</div>`;
  return html;
}

function renderTables() {
  const wrap = document.getElementById('tablesWrap');
  if (fonts.length === 0) {
    wrap.innerHTML = '<div class="empty-state">Drop font files above to begin</div>';
    return;
  }
  closeFieldPopover(false);
  // Keep collapsed sections collapsed across re-renders
  const collapsed = new Set([...wrap.querySelectorAll('.section-header.collapsed')]
    .map(h => h.textContent.trim()));
  _truncId.n = 0;
  let html = '';
  html += renderTableDirectory();
  html += buildCompareTable('head table', 'head', f => f.headTable, formatHeadValue);
  html += buildCompareTable('name table', 'name', f => f.nameTable, (field, val) => val != null ? String(val) : '', addedNameIds);
  html += buildCompareTable('OS/2 table', 'OS/2', f => f.os2Table, formatOS2Value);
  html += renderSTAT();
  html += renderAvar();
  wrap.innerHTML = html;
  wrap.querySelectorAll('.section-header').forEach(h => {
    if (collapsed.has(h.textContent.trim())) toggleSection(h);
  });
}

// ══════════════════════════════════════════════════════════
// Binary serialization
// ══════════════════════════════════════════════════════════

function serializeHeadForFont(f, changes) {
  const orig = f.binaryData.get('head');
  const out = new Uint8Array(orig);
  const dv = new DataView(out.buffer, out.byteOffset, out.byteLength);
  for (const [field, change] of changes) {
    const fDef = HEAD_LAYOUT.find(d => d.name === field);
    if (!fDef || fDef.readonly) continue;
    writeField(dv, 0, fDef, parseFieldValue(fDef, change.new_value));
  }
  dv.setUint32(8, 0);
  return out;
}

function serializeOS2ForFont(f, changes) {
  const orig = f.binaryData.get('OS/2');
  const out = new Uint8Array(orig);
  const dv = new DataView(out.buffer, out.byteOffset, out.byteLength);
  const version = dv.getUint16(0);
  const layout = getOS2Layout(version);
  for (const [field, change] of changes) {
    const fDef = layout.find(d => d.name === field);
    if (!fDef || fDef.readonly) continue;
    writeField(dv, 0, fDef, parseFieldValue(fDef, change.new_value));
  }
  return out;
}

function serializeNameForFont(f, changes) {
  const origRecords = f.binaryNameRecords || [];
  const nameChanges = new Map();
  for (const [field, change] of changes) nameChanges.set(parseInt(field), change);

  const newRecs = [];
  for (const rec of origRecords) {
    const ch = nameChanges.get(rec.nameID);
    if (ch) {
      if (ch.action === 'delete') continue;
      newRecs.push({ ...rec, string: ch.new_value });
    } else {
      newRecs.push(rec);
    }
  }

  // Add records for new name IDs (not in origRecords)
  const existingIds = new Set(origRecords.map(r => r.nameID));
  for (const [nameID, ch] of nameChanges) {
    if (!existingIds.has(nameID) && ch.action !== 'delete' && ch.new_value.trim() !== '') {
      newRecs.push({
        platformID: 3, encodingID: 1, languageID: 0x0409,
        nameID: nameID, string: ch.new_value,
      });
    }
  }

  newRecs.sort((a,b) =>
    a.platformID-b.platformID || a.encodingID-b.encodingID ||
    a.languageID-b.languageID || a.nameID-b.nameID);

  const encoded = newRecs.map(r => encodeNameString(r.string, r.platformID));
  const strOffset = 6 + newRecs.length * 12;
  let totalStr = 0;
  for (const e of encoded) totalStr += e.length;

  const buf = new ArrayBuffer(strOffset + totalStr);
  const dv = new DataView(buf);
  const bytes = new Uint8Array(buf);
  dv.setUint16(0, 0);
  dv.setUint16(2, newRecs.length);
  dv.setUint16(4, strOffset);

  let sp = 0;
  for (let i = 0; i < newRecs.length; i++) {
    const r = newRecs[i]; const sb = encoded[i];
    const ro = 6 + i * 12;
    dv.setUint16(ro, r.platformID);    dv.setUint16(ro+2, r.encodingID);
    dv.setUint16(ro+4, r.languageID);  dv.setUint16(ro+6, r.nameID);
    dv.setUint16(ro+8, sb.length);     dv.setUint16(ro+10, sp);
    bytes.set(sb, strOffset + sp);
    sp += sb.length;
  }
  return new Uint8Array(buf);
}

// ══════════════════════════════════════════════════════════
// Rebuild & Download
// ══════════════════════════════════════════════════════════

function rebuildFont(fontIdx) {
  const f = fonts[fontIdx];
  if (!f.binaryRecords || !f.binaryData) return null;

  // Gather changes for this font, grouped by table
  const tableChanges = new Map();
  for (const [key, change] of pendingChanges) {
    if (change.file === f.fileName) {
      if (!tableChanges.has(change.table)) tableChanges.set(change.table, new Map());
      tableChanges.get(change.table).set(change.field, change);
    }
  }

  const tags = f.binaryRecords.map(r => r.tag).filter(t => !deletedTables.has(t));
  const numTables = tags.length;
  const { searchRange, entrySelector, rangeShift } = calcSearchParams(numTables);
  const sfVer = new DataView(f.buffer).getUint32(0);

  // Prepare final table bytes
  const finalData = new Map();
  for (const tag of tags) {
    const tc = tableChanges.get(tag);
    if (tag === 'head') {
      finalData.set(tag, tc && tc.size > 0
        ? serializeHeadForFont(f, tc) : new Uint8Array(f.binaryData.get('head')));
      const hd = finalData.get(tag);
      new DataView(hd.buffer, hd.byteOffset, hd.byteLength).setUint32(8, 0);
    } else if (tag === 'OS/2' && tc && tc.size > 0) {
      finalData.set(tag, serializeOS2ForFont(f, tc));
    } else if (tag === 'name' && tc && tc.size > 0) {
      finalData.set(tag, serializeNameForFont(f, tc));
    } else {
      finalData.set(tag, f.binaryData.get(tag));
    }
  }

  // Calculate offsets (4-byte aligned)
  let offset = 12 + numTables * 16;
  const offsets = new Map();
  for (const tag of tags) {
    offset = (offset + 3) & ~3;
    offsets.set(tag, offset);
    offset += finalData.get(tag).length;
  }

  const totalSize = (offset + 3) & ~3;
  const buf = new ArrayBuffer(totalSize);
  const dv = new DataView(buf);
  const bytes = new Uint8Array(buf);

  // Write header
  dv.setUint32(0, sfVer);
  dv.setUint16(4, numTables);
  dv.setUint16(6, searchRange);
  dv.setUint16(8, entrySelector);
  dv.setUint16(10, rangeShift);

  // Write tables + directory
  for (let i = 0; i < tags.length; i++) {
    const tag = tags[i];
    const data = finalData.get(tag);
    const tOff = offsets.get(tag);
    bytes.set(data, tOff);
    const cs = calcTableChecksum(data);
    const ro = 12 + i * 16;
    writeTag(dv, ro, tag);
    dv.setUint32(ro + 4, cs);
    dv.setUint32(ro + 8, tOff);
    dv.setUint32(ro + 12, data.length);
  }

  // checksumAdjustment
  if (tags.includes('head')) {
    const headOff = offsets.get('head');
    dv.setUint32(headOff + 8, 0);
    const fileCS = calcTableChecksum(bytes);
    dv.setUint32(headOff + 8, (0xB1B0AFBA - fileCS) >>> 0);
  }

  return buf;
}

function downloadModifiedFonts() {
  const zip = new JSZip();
  let count = 0;

  for (let i = 0; i < fonts.length; i++) {
    const f = fonts[i];
    if (!f.binaryData) continue;

    // Check if this font has any changes
    let hasChanges = false;
    if (deletedTables.size > 0) {
      for (const tag of deletedTables) {
        if (f.binaryData.has(tag)) { hasChanges = true; break; }
      }
    }
    if (!hasChanges) {
      for (const ch of pendingChanges.values()) {
        if (ch.file === f.fileName) { hasChanges = true; break; }
      }
    }
    if (!hasChanges) continue;

    const buf = rebuildFont(i);
    if (!buf) continue;

    const ext = f.fileName.split('.').pop();
    const stem = f.fileName.replace(/\.[^.]+$/, '');
    const outName = `${stem}.patched.${ext}`;
    zip.file(outName, buf);
    count++;
  }

  if (count === 0) { alert('No fonts with changes to download.'); return; }

  const now = new Date();
  const pad = (n, len = 2) => String(n).padStart(len, '0');
  const ts = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}.${pad(now.getHours())}.${pad(now.getMinutes())}.${pad(now.getSeconds())}`;
  const zipName = `modified-fonts-${ts}.zip`;

  zip.generateAsync({ type: 'blob' }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = zipName;
    a.click();
    URL.revokeObjectURL(url);
  });
}

// ── Init ──
renderTables();
