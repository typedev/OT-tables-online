<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OT Tables Compare — name & OS/2 & head</title>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
:root {
  --bg: #1a1a1e;
  --bg-surface: #232328;
  --bg-row: #28282e;
  --bg-row-alt: #2e2e35;
  --bg-diff: #3a2a1a;
  --bg-edited: #1a2a3a;
  --border: #3a3a42;
  --border-accent: #5a5a65;
  --border-edit: #4a90d9;
  --text: #d4d4d8;
  --text-dim: #8a8a95;
  --text-label: #a0a0ab;
  --accent: #e8a44a;
  --accent-dim: #b07830;
  --red: #d45050;
  --green: #50b070;
  --blue: #4a90d9;
  --diff-mark: #e8a44a;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
}
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}

header {
  padding: 24px 32px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}

header h1 {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.02em;
}

header .subtitle {
  color: var(--text-dim);
  font-size: 12px;
}
</style>
<style>
.controls {
  padding: 12px 32px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.btn {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 14px;
  border: 1px solid var(--border-accent);
  background: var(--bg-surface);
  color: var(--text);
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s;
}
.btn:hover { background: var(--bg-row); border-color: var(--accent-dim); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: rgba(212,80,80,0.1); }
.btn.export { border-color: var(--blue); color: var(--blue); }
.btn.export:hover { background: rgba(74,144,217,0.1); }
.btn.export:disabled { opacity: 0.35; cursor: default; }

.toggle-label {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
.toggle-label input { accent-color: var(--accent); }

.spacer { flex: 1; }
</style>
<style>
#dropzone {
  margin: 20px 32px;
  padding: 40px;
  border: 2px dashed var(--border-accent);
  border-radius: 8px;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
}
#dropzone.drag-over {
  border-color: var(--accent);
  background: rgba(232,164,74,0.06);
  color: var(--accent);
}
#dropzone .icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }
#dropzone input { display: none; }

.tables-wrap {
  padding: 0 32px 60px;
  overflow-x: auto;
}

.section-header {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin: 28px 0 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-header .arrow { font-size: 10px; transition: transform 0.2s; }
.section-header.collapsed .arrow { transform: rotate(-90deg); }
</style>
<style>
table.compare {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  table-layout: fixed;
}
table.compare th, table.compare td {
  padding: 5px 10px;
  border: 1px solid var(--border);
  vertical-align: top;
  word-break: break-word;
}
table.compare thead th {
  background: var(--bg-surface);
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 11px;
  color: var(--text-label);
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
}
table.compare thead th .fname {
  display: block;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
table.compare thead th .remove-font {
  font-size: 10px;
  color: var(--red);
  cursor: pointer;
  opacity: 0.6;
  margin-left: 4px;
}
table.compare thead th .remove-font:hover { opacity: 1; }
</style>
<style>
table.compare th.param-col {
  width: 200px;
  min-width: 160px;
  background: var(--bg-surface);
}
table.compare tbody tr:nth-child(odd) { background: var(--bg-row); }
table.compare tbody tr:nth-child(even) { background: var(--bg-row-alt); }

table.compare tbody td.param-name {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 11px;
  color: var(--text-label);
  white-space: nowrap;
}
table.compare tbody td.val {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text);
  cursor: text;
  position: relative;
}
table.compare tbody td.val:hover {
  outline: 1px dashed var(--border-accent);
  outline-offset: -1px;
}
table.compare tbody td.val.editing {
  padding: 0;
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}
table.compare tbody td.val.edited {
  background: var(--bg-edited) !important;
}
table.compare tbody td.val.edited::after {
  content: '●';
  position: absolute;
  top: 2px;
  right: 4px;
  color: var(--blue);
  font-size: 8px;
}
table.compare tbody td.val textarea.cell-edit {
  width: 100%;
  height: 100%;
  min-height: 24px;
  background: var(--bg-surface);
  color: var(--text);
  border: none;
  outline: none;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 10px;
  resize: vertical;
}
table.compare tbody tr.has-diff td.val:not(.edited) {
  background: var(--bg-diff);
}
table.compare tbody tr.has-diff td.param-name {
  color: var(--diff-mark);
}
table.compare tbody tr.all-empty { display: none; }
table.compare tbody tr.all-empty.show-empty { display: table-row; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-size: 14px;
}

.font-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  padding: 2px 8px;
  background: var(--bg-row);
  border-radius: 3px;
}

.changes-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--blue);
  padding: 2px 8px;
  background: rgba(74,144,217,0.1);
  border-radius: 3px;
}

.show-full-btn {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-style: dotted;
  white-space: nowrap;
}
.show-full-btn:hover { color: var(--accent-dim); }
</style>
</head>
<body>
<header>
  <h1>OT Tables Compare</h1>
  <span class="subtitle">name & OS/2 & head — compare & edit</span>
</header>

<div class="controls">
  <button class="btn" onclick="document.getElementById('fileInput').click()">+ Add Fonts</button>
  <button class="btn danger" onclick="clearAll()">Clear All</button>
  <span class="font-count" id="fontCount">0 fonts loaded</span>
  <span class="changes-count" id="changesCount" style="display:none">0 edits</span>
  <div class="spacer"></div>
  <label class="toggle-label">
    <input type="checkbox" id="showEmpty" onchange="renderTables()"> Show empty
  </label>
  <label class="toggle-label">
    <input type="checkbox" id="diffOnly" onchange="renderTables()"> Diff only
  </label>
  <button class="btn export" id="exportBtn" disabled onclick="exportChanges()">Export Changes (.json)</button>
</div>

<div id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="icon">⬇</div>
  <div>Drop OTF / TTF files here or click to browse</div>
  <div style="font-size:11px; margin-top:4px; color:var(--text-dim)">Double-click any value to edit · Export changes as JSON for fonttools</div>
  <input type="file" id="fileInput" multiple accept=".otf,.ttf,.woff,.woff2" onchange="handleFiles(this.files)">
</div>

<div class="tables-wrap" id="tablesWrap"></div>

<script>
// ── State ──
const fonts = []; // { fileName, font, nameTable, os2Table, headTable }

// Changes: Map<string, {file, table, field, old_value, new_value}>
// key = "fileName|table|field"
const pendingChanges = new Map();

// ── Name IDs ──
const NAME_IDS = {
  0:'Copyright', 1:'Font Family', 2:'Font Subfamily', 3:'Unique ID',
  4:'Full Name', 5:'Version String', 6:'PostScript Name', 7:'Trademark',
  8:'Manufacturer', 9:'Designer', 10:'Description', 11:'Vendor URL',
  12:'Designer URL', 13:'License', 14:'License URL',
  16:'Typographic Family', 17:'Typographic Subfamily',
  18:'Compatible Full (Mac)', 19:'Sample Text',
  20:'PostScript CID findfont', 21:'WWS Family', 22:'WWS Subfamily',
  23:'Light Background Palette', 24:'Dark Background Palette',
  25:'Variations PostScript Prefix',
};

// ── OS/2 fields ──
const OS2_FIELDS = [
  'version','xAvgCharWidth','usWeightClass','usWidthClass','fsType',
  'ySubscriptXSize','ySubscriptYSize','ySubscriptXOffset','ySubscriptYOffset',
  'ySuperscriptXSize','ySuperscriptYSize','ySuperscriptXOffset','ySuperscriptYOffset',
  'yStrikeoutSize','yStrikeoutPosition','sFamilyClass','panose',
  'ulUnicodeRange1','ulUnicodeRange2','ulUnicodeRange3','ulUnicodeRange4',
  'achVendID','fsSelection','usFirstCharIndex','usLastCharIndex',
  'sTypoAscender','sTypoDescender','sTypoLineGap','usWinAscent','usWinDescent',
];
const OS2_FIELDS_V1 = ['ulCodePageRange1','ulCodePageRange2'];
const OS2_FIELDS_V2 = ['sxHeight','sCapHeight','usDefaultChar','usBreakChar','usMaxContext'];
const OS2_FIELDS_V5 = ['usLowerOpticalPointSize','usUpperOpticalPointSize'];

// ── head fields ──
const HEAD_FIELDS = [
  'magicNumber','fontRevision','flags','unitsPerEm','created','modified',
  'xMin','yMin','xMax','yMax','macStyle','lowestRecPPEM',
  'fontDirectionHint','indexToLocFormat','glyphDataFormat',
];

// ── Decode helpers ──
const WEIGHT_NAMES = {100:'Thin',200:'ExtraLight',250:'ExtraLight',300:'Light',350:'SemiLight',400:'Regular',500:'Medium',600:'SemiBold',700:'Bold',800:'ExtraBold',900:'Black',950:'ExtraBlack'};
const WIDTH_NAMES = {1:'Ultra-condensed',2:'Extra-condensed',3:'Condensed',4:'Semi-condensed',5:'Normal',6:'Semi-expanded',7:'Expanded',8:'Extra-expanded',9:'Ultra-expanded'};
const FSTYPE_BITS = {1:'Restricted License',2:'Preview & Print',3:'Editable',8:'No Subsetting',9:'Bitmap Only'};
const FSSELECTION_BITS = {0:'ITALIC',1:'UNDERSCORE',2:'NEGATIVE',3:'OUTLINED',4:'STRIKEOUT',5:'BOLD',6:'REGULAR',7:'USE_TYPO_METRICS',8:'WWS',9:'OBLIQUE'};
const HEAD_FLAGS_BITS = {0:'Y0_IS_BASELINE',1:'X_LSB_IS_AT_0',2:'SCALED_POINT_SIZE_DIFFERS',3:'USE_INTEGER_SCALING',4:'INSTRUCTIONS_ALTER_ADVANCE',5:'VERTICAL_LAYOUT',11:'LOSSLESS_COMPRESSION',12:'CONVERTED_FONT',13:'CLEARTYPE_OPTIMIZED',14:'LAST_RESORT_FONT'};
const MACSTYLE_BITS = {0:'Bold',1:'Italic',2:'Underline',3:'Outline',4:'Shadow',5:'Condensed',6:'Extended'};

function decodeBitfield(val, bitsMap) {
  if (val == null) return '';
  const v = typeof val === 'number' ? val : parseInt(val);
  const flags = [];
  for (const [bit, name] of Object.entries(bitsMap)) {
    if (v & (1 << parseInt(bit))) flags.push(name);
  }
  return flags.length ? flags.join(', ') : '(none)';
}

function formatPanose(arr) {
  if (!arr) return '';
  if (Array.isArray(arr)) return arr.join(' ');
  const keys = ['bFamilyType','bSerifStyle','bWeight','bProportion','bContrast','bStrokeVariation','bArmStyle','bLetterform','bMidline','bXHeight'];
  return keys.map(k => arr[k] != null ? arr[k] : '?').join(' ');
}

function hex32(val) {
  if (val == null) return '';
  return '0x' + (val >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

// ── Extractors ──
function extractNameTable(font) {
  const result = {};
  const names = font.names;
  if (!names) return result;
  const fieldToId = {
    copyright:0, fontFamily:1, fontSubfamily:2, uniqueID:3, fullName:4,
    version:5, postScriptName:6, trademark:7, manufacturer:8, designer:9,
    description:10, manufacturerURL:11, designerURL:12, license:13,
    licenseURL:14, preferredFamily:16, preferredSubfamily:17,
    compatibleFullName:18, sampleText:19, postScriptFindFontName:20,
    wWSFamilyName:21, wWSSubfamilyName:22, lightBackgroundPalette:23,
    darkBackgroundPalette:24, variationsPostScriptNamePrefix:25,
  };
  for (const [field, id] of Object.entries(fieldToId)) {
    const rec = names[field];
    if (rec) {
      const val = rec.en || Object.values(rec)[0] || '';
      if (val) result[id] = val;
    }
  }
  return result;
}

function extractOS2(font) {
  const os2 = font.tables && font.tables.os2;
  if (!os2) return null;
  const result = {};
  const allFields = [...OS2_FIELDS];
  if (os2.version >= 1) allFields.push(...OS2_FIELDS_V1);
  if (os2.version >= 2) allFields.push(...OS2_FIELDS_V2);
  if (os2.version >= 5) allFields.push(...OS2_FIELDS_V5);
  for (const f of allFields) result[f] = os2[f];
  return result;
}

function extractHead(font) {
  const head = font.tables && font.tables.head;
  if (!head) return null;
  const result = {};
  for (const f of HEAD_FIELDS) result[f] = head[f];
  return result;
}

// ── Formatters ──
function formatOS2Value(field, val) {
  if (val == null || val === undefined) return '';
  switch (field) {
    case 'usWeightClass': return `${val}` + (WEIGHT_NAMES[val] ? ` (${WEIGHT_NAMES[val]})` : '');
    case 'usWidthClass': return `${val}` + (WIDTH_NAMES[val] ? ` (${WIDTH_NAMES[val]})` : '');
    case 'fsType': return `${val} — ${decodeBitfield(val, FSTYPE_BITS)}`;
    case 'fsSelection': return `${val} — ${decodeBitfield(val, FSSELECTION_BITS)}`;
    case 'panose': return formatPanose(val);
    case 'ulUnicodeRange1': case 'ulUnicodeRange2': case 'ulUnicodeRange3': case 'ulUnicodeRange4':
    case 'ulCodePageRange1': case 'ulCodePageRange2': return hex32(val);
    case 'sFamilyClass': return `${val} (class ${(val >> 8) & 0xFF}, subclass ${val & 0xFF})`;
    default: return String(val);
  }
}

function formatHeadValue(field, val) {
  if (val == null || val === undefined) return '';
  switch (field) {
    case 'magicNumber': return '0x' + (val >>> 0).toString(16).toUpperCase().padStart(8, '0');
    case 'fontRevision': return typeof val === 'number' ? val.toFixed(3) : String(val);
    case 'flags': return `${val} — ${decodeBitfield(val, HEAD_FLAGS_BITS)}`;
    case 'macStyle': return `${val} — ${decodeBitfield(val, MACSTYLE_BITS)}`;
    case 'created': case 'modified':
      if (val instanceof Date) return val.toISOString().replace('T', ' ').replace(/\.000Z$/, ' UTC');
      try { return new Date(val).toISOString().replace('T', ' ').replace(/\.000Z$/, ' UTC'); }
      catch(e) { return String(val); }
    case 'fontDirectionHint':
      const hints = {0:'Mixed',1:'Left-to-right only',2:'Left-to-right + neutrals','-1':'Right-to-left only','-2':'Right-to-left + neutrals'};
      return `${val}` + (hints[val] ? ` (${hints[val]})` : '');
    case 'indexToLocFormat': return val === 0 ? '0 (short offsets)' : '1 (long offsets)';
    default: return String(val);
  }
}

// ── Drag & Drop ──
const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

async function handleFiles(fileList) {
  for (const file of fileList) {
    const ext = file.name.toLowerCase().split('.').pop();
    if (!['otf','ttf','woff','woff2'].includes(ext)) continue;
    try {
      const buf = await file.arrayBuffer();
      const font = opentype.parse(buf);
      fonts.push({
        fileName: file.name, font,
        nameTable: extractNameTable(font),
        os2Table: extractOS2(font),
        headTable: extractHead(font),
      });
    } catch (err) {
      console.error(`Error parsing ${file.name}:`, err);
      alert(`Failed to parse ${file.name}: ${err.message}`);
    }
  }
  updateCount();
  renderTables();
}

function removeFont(idx) {
  const fname = fonts[idx].fileName;
  fonts.splice(idx, 1);
  // Remove pending changes for this font
  for (const key of [...pendingChanges.keys()]) {
    if (key.startsWith(fname + '|')) pendingChanges.delete(key);
  }
  updateCount();
  updateChangesCount();
  renderTables();
}

function clearAll() {
  fonts.length = 0;
  pendingChanges.clear();
  updateCount();
  updateChangesCount();
  renderTables();
}

function updateCount() {
  document.getElementById('fontCount').textContent = `${fonts.length} font${fonts.length !== 1 ? 's' : ''} loaded`;
}

function updateChangesCount() {
  const el = document.getElementById('changesCount');
  const btn = document.getElementById('exportBtn');
  const n = pendingChanges.size;
  if (n > 0) {
    el.textContent = `${n} edit${n !== 1 ? 's' : ''}`;
    el.style.display = '';
    btn.disabled = false;
  } else {
    el.style.display = 'none';
    btn.disabled = true;
  }
}

// ── Editing ──
function startEdit(td, fontIdx, tableName, field, currentDisplayValue) {
  if (td.classList.contains('editing')) return;
  td.classList.add('editing');

  // Get the raw editable value (strip decoded annotations for OS/2 and head)
  const key = fonts[fontIdx].fileName + '|' + tableName + '|' + field;
  let editVal = pendingChanges.has(key) ? pendingChanges.get(key).new_value : currentDisplayValue;

  const textarea = document.createElement('textarea');
  textarea.className = 'cell-edit';
  textarea.value = editVal;
  td.innerHTML = '';
  td.appendChild(textarea);
  textarea.focus();
  textarea.select();

  const finish = () => {
    const newVal = textarea.value;
    td.classList.remove('editing');

    // Get original value for comparison
    const origDisplay = getOriginalDisplayValue(fontIdx, tableName, field);

    if (newVal !== origDisplay) {
      pendingChanges.set(key, {
        file: fonts[fontIdx].fileName,
        table: tableName,
        field: field,
        old_value: origDisplay,
        new_value: newVal,
      });
      td.classList.add('edited');
    } else {
      pendingChanges.delete(key);
      td.classList.remove('edited');
    }

    td.innerHTML = formatCell(newVal);
    if (pendingChanges.has(key)) td.classList.add('edited');
    updateChangesCount();
  };

  textarea.addEventListener('blur', finish);
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      textarea.value = getOriginalDisplayValue(fontIdx, tableName, field);
      textarea.blur();
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      textarea.blur();
    }
  });
}

function getOriginalDisplayValue(fontIdx, tableName, field) {
  const f = fonts[fontIdx];
  if (tableName === 'name') {
    const raw = f.nameTable[field];
    return raw != null ? String(raw) : '';
  }
  if (tableName === 'OS/2') {
    const raw = f.os2Table ? f.os2Table[field] : undefined;
    return formatOS2Value(field, raw);
  }
  if (tableName === 'head') {
    const raw = f.headTable ? f.headTable[field] : undefined;
    return formatHeadValue(field, raw);
  }
  return '';
}

// ── Export ──
function exportChanges() {
  if (pendingChanges.size === 0) return;

  const changes = [...pendingChanges.values()];
  const data = {
    _comment: "Generated by OT Tables Compare. Place this file alongside font files and run: python apply_changes.py <folder>",
    exported: new Date().toISOString(),
    changes: changes,
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'font_patch.changes.json';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Table builder ──
function escHtml(s) {
  if (!s && s !== 0) return '<span style="color:var(--text-dim)">—</span>';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const _truncId = { n: 0 };
function formatCell(v) {
  if (!v && v !== 0) return '<span style="color:var(--text-dim)">—</span>';
  const s = String(v);
  if (s.length <= 150) return escHtml(s);
  const id = 'trunc_' + (_truncId.n++);
  const short = escHtml(s.slice(0, 150)) + '…';
  const full = escHtml(s);
  return `<span id="${id}_short">${short} <a class="show-full-btn" onclick="event.stopPropagation();document.getElementById('${id}_short').style.display='none';document.getElementById('${id}_full').style.display='inline'">show&nbsp;full</a></span><span id="${id}_full" style="display:none">${full} <a class="show-full-btn" onclick="event.stopPropagation();document.getElementById('${id}_full').style.display='none';document.getElementById('${id}_short').style.display='inline'">collapse</a></span>`;
}

function toggleSection(el) {
  el.classList.toggle('collapsed');
  const body = el.nextElementSibling;
  if (body) body.style.display = el.classList.contains('collapsed') ? 'none' : '';
}

function buildCompareTable(title, tableName, getRowData, formatVal) {
  if (fonts.length === 0) return '';
  const showEmpty = document.getElementById('showEmpty').checked;
  const diffOnly = document.getElementById('diffOnly').checked;

  const allFields = new Set();
  const datas = fonts.map(f => getRowData(f) || {});
  datas.forEach(d => Object.keys(d).forEach(k => allFields.add(k)));
  const fields = [...allFields].sort((a, b) => {
    const na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });

  let html = `<div class="section-header" onclick="toggleSection(this)">
    <span class="arrow">▼</span> ${title}
  </div>
  <div class="section-body">
  <table class="compare">
  <thead><tr>
    <th class="param-col">Parameter</th>`;
  fonts.forEach((f, i) => {
    html += `<th><span class="fname" title="${f.fileName}">${f.fileName}</span>
      <span class="remove-font" onclick="removeFont(${i})" title="Remove">✕</span></th>`;
  });
  html += `</tr></thead><tbody>`;

  for (const field of fields) {
    const vals = datas.map(d => {
      const raw = d[field];
      return formatVal ? formatVal(field, raw) : (raw != null ? String(raw) : '');
    });

    const allEmpty = vals.every(v => v === '' || v === undefined || v === null);
    const allSame = vals.every(v => v === vals[0]);
    const hasDiff = !allSame && !allEmpty;
    if (diffOnly && !hasDiff) continue;
    const emptyClass = allEmpty ? (showEmpty ? 'all-empty show-empty' : 'all-empty') : '';
    const diffClass = hasDiff ? 'has-diff' : '';

    let label = field;
    if (tableName === 'name' && NAME_IDS[field]) label = `${field} — ${NAME_IDS[field]}`;

    html += `<tr class="${emptyClass} ${diffClass}">
      <td class="param-name">${label}</td>`;
    vals.forEach((v, i) => {
      const key = fonts[i].fileName + '|' + tableName + '|' + field;
      const isEdited = pendingChanges.has(key);
      const displayVal = isEdited ? pendingChanges.get(key).new_value : v;
      const editedClass = isEdited ? ' edited' : '';
      html += `<td class="val${editedClass}" ondblclick="startEdit(this, ${i}, '${tableName}', '${field}', ${JSON.stringify(displayVal || '')})">${formatCell(displayVal)}</td>`;
    });
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

function renderTables() {
  const wrap = document.getElementById('tablesWrap');
  if (fonts.length === 0) {
    wrap.innerHTML = '<div class="empty-state">Drop font files above to begin comparison</div>';
    return;
  }
  _truncId.n = 0;
  let html = '';
  html += buildCompareTable('head table', 'head', f => f.headTable, (field, val) => formatHeadValue(field, val));
  html += buildCompareTable('name table', 'name', f => f.nameTable, (field, val) => val != null ? String(val) : '');
  html += buildCompareTable('OS/2 table', 'OS/2', f => f.os2Table, (field, val) => formatOS2Value(field, val));
  wrap.innerHTML = html;
}

renderTables();
</script>
</body>
</html>
